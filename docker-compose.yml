name: smart-cbt

services:
  smart-cbt-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-cbt-app
    restart: always
    working_dir: /var/www/html
    volumes:
      - smart-cbt-storage:/var/www/html/storage/app/public
      - smart-cbt-cache:/var/www/html/bootstrap/cache
      - smart-cbt-public:/var/www/html/public
      - ./.env:/var/www/html/.env
    environment:
      - APP_NAME=Smart-CBT
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8008}
      - DB_CONNECTION=pgsql
      - DB_HOST=smart-cbt-db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-smart_cbt}
      - DB_USERNAME=${DB_USERNAME:-smart_cbt}
      - DB_PASSWORD=${DB_PASSWORD:-smart_cbt_password}
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - SESSION_COOKIE=smart_cbt_session
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=smart-redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - REDIS_DB=1
      - REDIS_PREFIX=smart_cbt_
    depends_on:
      smart-cbt-db:
        condition: service_healthy
    networks:
      - smart-network

  smart-cbt-db:
    image: postgres:16
    container_name: smart-cbt-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-smart_cbt}
      POSTGRES_USER: ${DB_USERNAME:-smart_cbt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smart_cbt_password}
    ports:
      - "5433:5432"
    volumes:
      - smart-cbt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-smart_cbt} -d ${DB_DATABASE:-smart_cbt}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smart-network

  smart-cbt-web:
    image: nginx:alpine
    container_name: smart-cbt-web
    restart: always
    ports:
      - "${CBT_WEB_PORT:-8008}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - smart-cbt-public:/var/www/html/public
      - smart-cbt-storage:/var/www/html/storage/app/public
    depends_on:
      - smart-cbt-app
    networks:
      - smart-network

  # Task Scheduler untuk auto-rotate token ujian (sesuai bootstrap/app.php)
  smart-cbt-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-cbt-scheduler
    restart: always
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - smart-cbt-storage:/var/www/html/storage/app/public
      - smart-cbt-cache:/var/www/html/bootstrap/cache
      - ./.env:/var/www/html/.env
    environment:
      - APP_NAME=Smart-CBT
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8008}
      - DB_CONNECTION=pgsql
      - DB_HOST=smart-cbt-db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-smart_cbt}
      - DB_USERNAME=${DB_USERNAME:-smart_cbt}
      - DB_PASSWORD=${DB_PASSWORD:-smart_cbt_password}
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - SESSION_COOKIE=smart_cbt_session
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=smart-redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - REDIS_DB=1
      - REDIS_PREFIX=smart_cbt_
    depends_on:
      - smart-cbt-app
    networks:
      - smart-network

volumes:
  smart-cbt-storage:
  smart-cbt-cache:
  smart-cbt-public:
  smart-cbt-pgdata:

networks:
  smart-network:
    external: true
    name: smart-network
